services:
  homeassistant:
    container_name: homeassistant
    # docker.io mirror — ghcr.io stalled on pull from this network.
    image: docker.io/homeassistant/home-assistant:stable
    restart: unless-stopped
    network_mode: host
    privileged: false
    devices:
      - /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_4c879acf009eef11867ad9a661ce3355-if00-port0:/dev/ttyUSB0
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Vilnius
    # Pi 4 (4GB): cap so HA can't starve the other jobs on this Pi.
    mem_limit: 2g

