# Loads HA defaults (frontend, history, etc.)
default_config:

# Pi 3 is I/O and memory constrained — keep the recorder small.
recorder:
  purge_keep_days: 7
  commit_interval: 30
  exclude:
    domains:
      - updater
      - sun

# Trust the LAN and reverse proxies on the Pi itself.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

# Vacuum map pulled from Xiaomi cloud (gen1 1S map is cloud-hosted). Used once
# to capture zone coordinates for local app_zoned_clean buttons. Secrets live in
# secrets.yaml on the Pi (git-ignored).
camera:
  - platform: xiaomi_cloud_map_extractor
    name: Vacuum Map
    host: !secret vacuum_host
    token: !secret vacuum_token
    username: !secret xiaomi_username
    password: !secret xiaomi_password
    country: !secret xiaomi_country
    auto_update: true
    scan_interval: 8
    draw: ["all"]
    attributes:
      - calibration_points
      - rooms
      - charger

logger:
  default: warning
  logs:
    # Debug for native Yeelight to capture the occasional ceiling-light
    # reconnect/flicker (power glitches from the no-neutral wall switch).
    homeassistant.components.yeelight: debug
    # Silence the dead Xiaomi-cloud "Unable to discover" spam for the
    # ceiling lights, which now run on the native Yeelight integration.
    custom_components.xiaomi_miot.core.device.yeelink: critical
    custom_components.yandex_station: debug
    homeassistant.components.zha: debug
    zigpy: debug

# Curated dashboard in YAML (version-controlled). The default Overview stays
# UI-managed; this adds a "Home" dashboard in the sidebar.
lovelace:
  dashboards:
    home-yaml:
      mode: yaml
      title: Home
      icon: mdi:home-assistant
      show_in_sidebar: true
      filename: dashboards/home.yaml

# Helpers for UI interactions
input_text:
  alice_say_message:
    name: "Текст для Алисы"
    initial: ""
    max: 255
    icon: mdi:message-text

# Scripts
script:
  alice_say:
    alias: "Алиса: Произнести текст"
    icon: mdi:account-voice
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('input_text.alice_say_message') | trim != '' }}"
      - action: media_player.play_media
        target:
          entity_id: media_player.yandex_station_ff98f0295a9abe270b195357
        data:
          media_content_type: text
          media_content_id: "{{ states('input_text.alice_say_message') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.alice_say_message
        data:
          value: ""

  alice_call_veronika:
    alias: "Позвать Веронику"
    icon: mdi:account-alert
    mode: single
    sequence:
      - action: media_player.play_media
        target:
          entity_id: media_player.yandex_station_ff98f0295a9abe270b195357
        data:
          media_content_type: text
          media_content_id: "Вероника, тебя зовут родители"

  # A script, not a scene: on Arwen, turning the main light off also kills
  # the backlight, so the backlight must be turned on after, in this order.
  bedroom_intimate:
    alias: "Интимный свет"
    icon: mdi:heart
    mode: restart
    sequence:
      - action: light.turn_off
        target:
          entity_id: light.yeelight_ceilb_0x182d2b96
      - delay: 1
      - action: light.turn_on
        target:
          entity_id: light.yeelight_ceilb_0x182d2b96_ambilight
        data:
          brightness: 153
          rgb_color: [255, 40, 80]

# Scenes
scene:
  - id: bedroom_daylight
    name: "Дневной свет"
    icon: mdi:white-balance-sunny
    entities:
      light.yeelight_ceilb_0x182d2b96:
        state: "on"
        brightness: 255
        color_temp_kelvin: 4000
      light.yeelight_ceilb_0x182d2b96_ambilight:
        state: "on"
        brightness: 255
        rgb_color: [255, 105, 180]

  # Before sleep: warmest white, dimmed, amber backlight.
  - id: bedroom_evening
    name: "Вечерний свет"
    icon: mdi:weather-night
    entities:
      light.yeelight_ceilb_0x182d2b96:
        state: "on"
        brightness: 128
        color_temp_kelvin: 2700
      light.yeelight_ceilb_0x182d2b96_ambilight:
        state: "on"
        brightness: 102
        rgb_color: [255, 140, 50]

# Automations
automation:
  # Once a night: bedside lamp off, then all wall switches off. The ceilings
  # are behind the switches, so cutting the switch powers them down too.
  - id: night_all_lights_off
    alias: "Ночь: выключить весь свет"
    mode: single
    triggers:
      - trigger: time
        at: "00:00:00"
    actions:
      - action: light.turn_off
        continue_on_error: true
        target:
          entity_id: light.yeelink_bslamp2_5e7b_light
      - action: light.turn_off
        continue_on_error: true
        target:
          entity_id:
            - light.switch_spalnia
            - light.lumi_lumi_switch_b1lc04
            - light.switch_gostinnaia
            - light.kukhnia_switch_kukhnia

  # Arwen follows the clock: evening 20:00–07:30, day otherwise. At the switch
  # times it only restyles a lamp whose main light is on (so the intimate mode,
  # main off, is left alone). When the wall switch powers the lamp up it comes
  # back from `unavailable`, and gets the mode for the current time.
  - id: bedroom_light_by_time
    alias: "Спальня: дневной/вечерний свет по времени"
    mode: restart
    triggers:
      - trigger: time
        at: "20:00:00"
        id: clock
      - trigger: time
        at: "07:30:00"
        id: clock
      - trigger: state
        entity_id: light.yeelight_ceilb_0x182d2b96
        from: "unavailable"
        to:
          - "on"
          - "off"
        id: power_on
    conditions:
      - condition: or
        conditions:
          - condition: trigger
            id: power_on
          - condition: state
            entity_id: light.yeelight_ceilb_0x182d2b96
            state: "on"
    actions:
      - if:
          - condition: time
            after: "20:00:00"
            before: "07:30:00"
        then:
          - action: scene.turn_on
            target:
              entity_id: scene.vechernii_svet
        else:
          - action: scene.turn_on
            target:
              entity_id: scene.dnevnoi_svet


