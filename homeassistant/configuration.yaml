# Loads HA defaults (frontend, history, etc.)
default_config:

# Pi 3 is I/O and memory constrained — keep the recorder small.
recorder:
  purge_keep_days: 7
  commit_interval: 30
  exclude:
    domains:
      - updater
      - sun

# Trust the LAN and reverse proxies on the Pi itself.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1
    - ::1

# Vacuum map pulled from Xiaomi cloud (gen1 1S map is cloud-hosted). Used once
# to capture zone coordinates for local app_zoned_clean buttons. Secrets live in
# secrets.yaml on the Pi (git-ignored).
camera:
  - platform: xiaomi_cloud_map_extractor
    name: Vacuum Map
    host: !secret vacuum_host
    token: !secret vacuum_token
    username: !secret xiaomi_username
    password: !secret xiaomi_password
    country: !secret xiaomi_country
    auto_update: true
    scan_interval: 8
    draw: ["all"]
    attributes:
      - calibration_points
      - rooms
      - charger

logger:
  default: warning
  logs:
    # Debug for native Yeelight to capture the occasional ceiling-light
    # reconnect/flicker (power glitches from the no-neutral wall switch).
    homeassistant.components.yeelight: debug
    # Silence the dead Xiaomi-cloud "Unable to discover" spam for the
    # ceiling lights, which now run on the native Yeelight integration.
    custom_components.xiaomi_miot.core.device.yeelink: critical
    custom_components.yandex_station: debug
    homeassistant.components.zha: debug
    zigpy: debug

# Curated dashboard in YAML (version-controlled). The default Overview stays
# UI-managed; this adds a "Home" dashboard in the sidebar.
lovelace:
  dashboards:
    home-yaml:
      mode: yaml
      title: Home
      icon: mdi:home-assistant
      show_in_sidebar: true
      filename: dashboards/home.yaml

# Helpers for UI interactions
input_text:
  alice_say_message:
    name: "Текст для Алисы"
    initial: ""
    max: 255
    icon: mdi:message-text

# Scripts
script:
  alice_say:
    alias: "Алиса: Произнести текст"
    icon: mdi:account-voice
    mode: single
    sequence:
      - condition: template
        value_template: "{{ states('input_text.alice_say_message') | trim != '' }}"
      - action: media_player.play_media
        target:
          entity_id: media_player.yandex_station_ff98f0295a9abe270b195357
        data:
          media_content_type: text
          media_content_id: "{{ states('input_text.alice_say_message') }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.alice_say_message
        data:
          value: ""

  alice_call_veronika:
    alias: "Позвать Веронику"
    icon: mdi:account-alert
    mode: single
    sequence:
      - action: media_player.play_media
        target:
          entity_id: media_player.yandex_station_ff98f0295a9abe270b195357
        data:
          media_content_type: text
          media_content_id: "Вероника, тебя зовут родители"

# Automations
automation:
  # Once a night: bedside lamp off, then all wall switches off. The ceilings
  # are behind the switches, so cutting the switch powers them down too.
  - id: night_all_lights_off
    alias: "Ночь: выключить весь свет"
    mode: single
    triggers:
      - trigger: time
        at: "00:00:00"
    actions:
      - action: light.turn_off
        continue_on_error: true
        target:
          entity_id: light.yeelink_bslamp2_5e7b_light
      - action: light.turn_off
        continue_on_error: true
        target:
          entity_id:
            - light.switch_spalnia
            - light.lumi_lumi_switch_b1lc04
            - light.switch_gostinnaia
            - light.kukhnia_switch_kukhnia


