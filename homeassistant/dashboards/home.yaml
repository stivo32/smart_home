title: Home
views:
  - title: Главная
    path: main
    icon: mdi:sofa
    cards:
      - type: horizontal-stack
        cards:
          - type: button
            name: Старт
            icon: mdi:play
            show_state: false
            tap_action:
              action: perform-action
              perform_action: vacuum.start
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner
          - type: button
            name: Пауза
            icon: mdi:pause
            tap_action:
              action: perform-action
              perform_action: vacuum.pause
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner
          - type: button
            name: Стоп
            icon: mdi:stop
            tap_action:
              action: perform-action
              perform_action: vacuum.stop
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner
          - type: button
            name: На базу
            icon: mdi:home-map-marker
            tap_action:
              action: perform-action
              perform_action: vacuum.return_to_base
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner
          - type: button
            name: Найти
            icon: mdi:map-marker-radius
            tap_action:
              action: perform-action
              perform_action: vacuum.locate
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner

      - type: entities
        title: Свет
        show_header_toggle: true
        entities:
          - entity: light.yeelink_bslamp2_5e7b_light
            name: Лампа
          - entity: light.yeelink_ceila_9b89_light
            name: Потолок (гостиная)
            secondary_info: last-changed
          - entity: light.yeelink_ceilb_5b2c_light
            name: Потолок (Arwen)
            secondary_info: last-changed
          - entity: light.yeelink_ceilb_5b2c_ambient_light
            name: Потолок (подсветка)

      - type: entities
        title: Выключатели
        entities:
          - entity: switch.lumi_b1lc04_2231_switch
            name: Выключатель

      - type: entities
        title: Климат
        entities:
          - entity: sensor.miaomiaoce_t2_12f4_temperature
            name: Температура
          - entity: sensor.miaomiaoce_t2_12f4_relative_humidity
            name: Влажность
          - entity: sensor.miaomiaoce_t2_12f4_battery_level
            name: Батарея датчика

      - type: entities
        title: Пылесос — детали
        entities:
          - entity: sensor.roborock_m1s_f706_status
            name: Статус
          - entity: sensor.roborock_m1s_f706_battery_level
            name: Заряд
          - entity: sensor.roborock_m1s_f706_props_clean_area
            name: Площадь уборки
          - entity: sensor.roborock_m1s_f706_props_clean_time
            name: Время уборки
          - entity: select.roborock_m1s_f706_mode
            name: Режим
