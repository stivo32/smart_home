title: Home
views:
  - title: Главная
    path: main
    icon: mdi:sofa
    cards:
      - type: horizontal-stack
        cards:
          - type: button
            name: Старт
            icon: mdi:play
            show_state: false
            tap_action:
              action: perform-action
              perform_action: vacuum.start
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner
          - type: button
            name: Пауза
            icon: mdi:pause
            tap_action:
              action: perform-action
              perform_action: vacuum.pause
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner
          - type: button
            name: Стоп
            icon: mdi:stop
            tap_action:
              action: perform-action
              perform_action: vacuum.stop
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner
          - type: button
            name: На базу
            icon: mdi:home-map-marker
            tap_action:
              action: perform-action
              perform_action: vacuum.return_to_base
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner
          - type: button
            name: Найти
            icon: mdi:map-marker-radius
            tap_action:
              action: perform-action
              perform_action: vacuum.locate
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner

      - type: entities
        title: Алиса (Яндекс Станция)
        entities:
          - entity: input_text.alice_say_message
            name: Сообщение
          - entity: script.alice_say
            name: Произнести
          - entity: script.alice_call_veronika
            name: Позвать Веронику
          - entity: media_player.yandex_station_ff98f0295a9abe270b195357
            name: Яндекс Мини

      - type: entities
        title: Выключатели
        show_header_toggle: true
        entities:
          - entity: light.kukhnia_switch_kukhnia
            name: Кухня
          - entity: light.switch_gostinnaia
            name: Гостиная
          - entity: light.switch_spalnia
            name: Спальня
          - entity: light.lumi_lumi_switch_b1lc04
            name: Детская
          - entity: light.yeelink_bslamp2_5e7b_light
            name: Лампа

      - type: entities
        title: Климат
        entities:
          - entity: sensor.miaomiaoce_t2_12f4_temperature
            name: Температура
          - entity: sensor.miaomiaoce_t2_12f4_relative_humidity
            name: Влажность
          - entity: sensor.miaomiaoce_t2_12f4_battery_level
            name: Батарея датчика

      - type: entities
        title: Пылесос — детали
        entities:
          - entity: sensor.roborock_m1s_f706_status
            name: Статус
          - entity: sensor.roborock_m1s_f706_battery_level
            name: Заряд
          - entity: sensor.roborock_m1s_f706_props_clean_area
            name: Площадь уборки
          - entity: sensor.roborock_m1s_f706_props_clean_time
            name: Время уборки
          - entity: select.roborock_m1s_f706_mode
            name: Режим

      - type: entities
        title: Свет
        show_header_toggle: true
        entities:
          - entity: light.yeelight_ceila_0x1a61970c
            name: Потолок Pro 1
          - entity: light.yeelight_ceila_0x17a26c8e
            name: Потолок Pro 2
          - entity: light.yeelight_ceilb_0x182d2b96
            name: Потолок Arwen
          - entity: light.yeelight_ceilb_0x182d2b96_ambilight
            name: Arwen подсветка

      - type: vertical-stack
        cards:
          - type: markdown
            content: "### Спальня — режим света"
          - type: horizontal-stack
            cards:
              - type: button
                name: Дневной
                icon: mdi:white-balance-sunny
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.dnevnoi_svet
              - type: button
                name: Вечерний
                icon: mdi:weather-night
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.vechernii_svet
              - type: button
                name: Интимный
                icon: mdi:heart
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.bedroom_intimate


