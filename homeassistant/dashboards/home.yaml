title: Home
views:
  - title: Главная
    path: main
    icon: mdi:sofa
    cards:
      - type: horizontal-stack
        cards:
          - type: button
            name: Старт
            icon: mdi:play
            show_state: false
            tap_action:
              action: perform-action
              perform_action: vacuum.start
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner
          - type: button
            name: Пауза
            icon: mdi:pause
            tap_action:
              action: perform-action
              perform_action: vacuum.pause
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner
          - type: button
            name: Стоп
            icon: mdi:stop
            tap_action:
              action: perform-action
              perform_action: vacuum.stop
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner
          - type: button
            name: На базу
            icon: mdi:home-map-marker
            tap_action:
              action: perform-action
              perform_action: vacuum.return_to_base
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner
          - type: button
            name: Найти
            icon: mdi:map-marker-radius
            tap_action:
              action: perform-action
              perform_action: vacuum.locate
              target:
                entity_id: vacuum.roborock_m1s_f706_robot_cleaner

      - type: entities
        title: Свет
        show_header_toggle: true
        entities:
          - entity: light.yeelink_bslamp2_5e7b_light
            name: Лампа
          - entity: light.yeelight_ceila_0x1a61970c
            name: Потолок Pro 1
          - entity: light.yeelight_ceila_0x17a26c8e
            name: Потолок Pro 2
          - entity: light.yeelight_ceilb_0x182d2b96
            name: Потолок Arwen
          - entity: light.yeelight_ceilb_0x182d2b96_ambilight
            name: Arwen подсветка

      - type: entities
        title: Выключатели
        show_header_toggle: true
        entities:
          - entity: light.kukhnia_switch_kukhnia
            name: Кухня
            icon: mdi:wall-switch
          - entity: light.switch_gostinnaia
            name: Гостиная
            icon: mdi:wall-switch
          - entity: light.switch_spalnia
            name: Спальня
            icon: mdi:wall-switch
          - entity: light.lumi_lumi_switch_b1lc04
            name: Детская
            icon: mdi:wall-switch

      - type: entities
        title: Климат
        entities:
          - entity: sensor.miaomiaoce_t2_12f4_temperature
            name: Температура
          - entity: sensor.miaomiaoce_t2_12f4_relative_humidity
            name: Влажность
          - entity: sensor.miaomiaoce_t2_12f4_battery_level
            name: Батарея датчика

      - type: entities
        title: Пылесос — детали
        entities:
          - entity: sensor.roborock_m1s_f706_status
            name: Статус
          - entity: sensor.roborock_m1s_f706_battery_level
            name: Заряд
          - entity: sensor.roborock_m1s_f706_props_clean_area
            name: Площадь уборки
          - entity: sensor.roborock_m1s_f706_props_clean_time
            name: Время уборки
          - entity: select.roborock_m1s_f706_mode
            name: Режим
